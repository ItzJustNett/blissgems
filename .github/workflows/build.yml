name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B package -DskipTests

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: BlissGems-${{ github.sha }}
          path: target/BlissGems-*.jar
          if-no-files-found: error

      - name: Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/BlissGems-*.jar
          generate_release_notes: true

      # A push to a release branch named bliss/V<version> publishes release v<version>,
      # creating the tag on that commit (for when tags can't be pushed directly).
      - name: Release tag from branch
        id: branchtag
        if: startsWith(github.ref, 'refs/heads/bliss/V')
        run: echo "tag=v${GITHUB_REF_NAME#bliss/V}" >> "$GITHUB_OUTPUT"

      - name: Release (release branch)
        if: startsWith(github.ref, 'refs/heads/bliss/V')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.branchtag.outputs.tag }}
          name: BlissGems ${{ steps.branchtag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: target/BlissGems-*.jar
          generate_release_notes: true
