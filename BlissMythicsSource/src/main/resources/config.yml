heretic:
  crit-multiplier: 1.5
  bleed-multiplier: 2.0
  bloodsaws-damage: 6.0
  bloodsaw-drag-ticks: 20  # How long a saw drags something it cut along in its wake
  bloodsaw-max-bounces: 3  # How many times a blood saw ricochets off walls before dying
  bloodsaw-life-ticks: 60  # Saw lifetime in ticks (~0.9 blocks/tick) — effectively its range
  bloodlink-damage: 9.0
  hurricane-damage: 4.0
  max-hit-cap: 13.0
  saw-window-ms: 4000
  bleed-ms: 8000
  bloodlink-duration-ms: 15000
  bloodlink-rise-ticks: 6  # Lower = the bloodlink slam yanks the target down faster
  bloodlink-range: 15.0
  bloodlink-knockup: 0.6  # Upward velocity added to entities hit by a Bloodlink landing
  bloodlink-min-rise: 2.7  # Floor on every hop's upward launch, so chained slams rise like the first. Server cap is 3.9
  bloodlink-max-hits: 0  # Slams in one chain; each has to connect to earn the next. 0 = unlimited
  cooldowns:
    bloodsaws: 25
    bloodlink: 60

auratus:
  perforator-damage: 6.0
  slam-damage: 12.0
  slam-knockup: 1.6  # Upward velocity added to entities hit by a ground slam
  aegis-heal: 5.0
  aegis-window-ms: 1500
  anchor-window-ms: 5000
  chain:
    range: 55.0
    charges: 2
    regen-ms: 8000
    min-interval-ms: 700  # Hard floor between chain shots (lowered so slam combos chain)
    fly-speed: 4.5
    fly-max-ticks: 60
  slam:
    min-height: 8.0  # Blocks of fall height required above the landing spot to trigger a slam
    launch-force: 2.6  # Vertical launch given to the caster after a successful slam (~10 blocks higher)
    decal-size: 3.0  # Size of the crater/smash effect model spawned on a slam
    no-windcharge-radius: 5.0  # Blocks around a fresh slam crater where wind charges fizzle
    no-windcharge-ms: 2500  # How long the wind charge lockout lasts after a slam
    window-ms: 6000  # How long after the grapple the caster can still land a slam
    fall-grace-ms: 8000  # How long the caster's landings are fall-damage free after a grapple/slam
  hauling-strike:
    pull: 0.5  # How hard normal Auratus hits drag the victim towards the holder (0 = no pull)
    lift: 0.1  # Upward part of that pull
  # Toggle Auratus passives on/off
  passives:
    hauling-strike: true  # Pull victims toward you on normal hits
    sneak-haste: true     # Haste II while sneaking + holding Auratus
  cooldowns:
    aegis: 45
