  wealth-no-player: "<gradient:#FF5F6D:#FFC371>No player target found!</gradient>"
  bloodthorns-hit: "{message} &7({count} targets hit!)"
  shift-for-secondary: "<gradient:#FFE259:#FFA751><italic>Shift + use ability or right-click for secondary ability!</italic></gradient>"
  no-gem-types-available: "<gradient:#FF5F6D:#FFC371>No other gem types available!</gradient>"
  trade-failed: "<gradient:#FF5F6D:#FFC371>Failed to trade gem!</gradient>"
  upgrade-failed: "<gradient:#FF5F6D:#FFC371>Failed to upgrade gem!</gradient>"

  # SMP Start Messages
  smp-already-started: "<gradient:#FF5F6D:#FFC371>SMP has already started!</gradient>"
  smp-started: "<gradient:#56F39A:#3ACBE8><bold>SMP Started! All online players are receiving their gems!</bold></gradient>"
  smp-not-started: "<gradient:#FF5F6D:#FFC371>The SMP hasn't started yet! Gems will be given when an admin runs /bliss smp start.</gradient>"

# ==========================================
# ENCHANT LIMITER (ADMIN CONFIGURABLE)
# ==========================================
enchant-limiter:
  enabled: true
  limits:
    sharpness: 5
    protection: 4
    density: 2
    breach: 0
    wind_burst: 0

# ==========================================
# SPAWN BEACON & REPAIRS
# ==========================================
spawn-beacon:
  world: "world"
  x: 0.5
  y: 64.0
  z: 0.5
  radius: 15.0
  require-beacon-for-repairs: true
  repair-schedule:
    # UTC hours when gem repairs are permitted (0, 6, 12, 18)
    open-hours-utc:
      - 0
      - 6
      - 12
      - 18
    # Duration in minutes each window remains open
    duration-minutes: 60

# ==========================================
# SPAWN RESTORATION PEDESTAL
# ==========================================
# Set it in-game: stand on the spot, /bliss pedestal set, then /bliss pedestal activate.
# Repair ritual: drop a Repair Kit at the open pedestal, then throw 5 Energy Bottles into
#   the beacon -> everyone within 8 blocks gets +1 energy five times, 10 s apart.
# Restoration ritual: while BROKEN, drop a Restoration Book, throw 5 Energy Bottles, then
#   stand still on the beacon -> back to Pristine with a freshly rolled gem.
# Block layout lives in pedestal_layout.yml ("open" and "closed" states).
pedestal:
  deposit-cooldown-seconds: 30
  # Fallback location used only when no pedestal has been set in-game.
  # /bliss pedestal export prints the values to paste here.
  fixed:
    enabled: false
    world: world
    x: 0
    y: 64
    z: 0
  repair-energy-to-everyone: false  # true = every player within 8 blocks gets the repair's energy (lets groups duplicate energy)

# ==========================================
# VILLAGER EVENT (/blissevent)
# ==========================================
# 1) /bliss pedestal set + activate (the disc ritual runs over the pedestal)
# 2) /blissevent compass set  - stand where the lost village should be
# 3) /blissevent villager set <1|2|3> next to three villagers you hid around the world
# 4) /blissevent start
villager-event:
  # Custom sounds from your resource pack; missing keys just play nothing.
  disc-song-key: "bliss:village_clue"
  # false = the disc spells the village coordinates out in a title instead of playing audio
  clue-audio: true
  lost-souls-audio: true
  # Every raid wave's mob count is multiplied by this (0.05 - 3.0). 1.0 = wave 8 is ~110 raiders.
  raid-mob-scale: 1.0

# ==========================================
# BROKEN MYTHIC RESPAWN
# ==========================================
mythic-respawn:
  timer-days: 7  # 7-day countdown after break before reforming
  world-border-size: 10000  # 10k x 10k coordinates border

# ==========================================
# MAIN END ISLAND SKY ATMOSPHERE
# ==========================================
end-sky:
  enabled: true
  green-black-gradient: true

# ==========================================
# METRICS
# ==========================================
send-anonymous-metrics: true
pvp:
  drop-head-on-kill: true  # Drop the victim's head on a player kill
