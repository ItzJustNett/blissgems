# BlissGems Configuration File
# DO NOT modify the config-version unless you know what you're doing!
config-version: "1.0.0"

# ==========================================
# GENERAL SETTINGS
# ==========================================
# Disable optional chat messages (ability activations, click errors, etc.)
# Set to true to reduce chat spam
disable-optional-messages: true

# ==========================================
# AUTO-UPDATE (Modrinth)
# ==========================================
# On startup, check Modrinth for a newer build. A running jar can't be swapped live,
# so a new version is downloaded into plugins/update/ and applied on the next restart.
auto-update:
  enabled: true
  # Your Modrinth project slug or id (REQUIRED). Find it in the project URL:
  # modrinth.com/plugin/<slug>. Leave empty to disable the check.
  modrinth-project: ""
  # true = only log that an update exists, never download it automatically.
  notify-only: false

# ==========================================
# ENERGY SYSTEM
# ==========================================
energy:
  # Energy gained on player kill
  gain-on-kill: 1
  # Energy lost on death
  loss-on-death: 1
  # Maximum energy level
  max-energy: 10
  # Starting energy for pristine gems
  starting-energy: 10
  # Energy at which passives stop working (Ruined state)
  ruined-threshold: 1
  # Energy at which abilities cannot be used (Broken state)
  broken-threshold: 0
  # Ban players when they reach 0 energy
  ban-on-zero-energy: false

# ==========================================
# GEM SETTINGS
# ==========================================
gems:
  # Enable/disable specific gem types
  enabled:
    astra: true
    fire: true
    flux: true
    life: true
    puff: true
    speed: true
    strength: true
    wealth: true

  # Only one gem can be active at a time
  single-gem-only: true

  # Prevent gems from being dropped or moved out of inventory
  # When enabled, gems cannot be: dropped (Q), placed in containers/frames,
  # given to entities, moved by hoppers, or lost in any other way
  prevent-drop: true

  # Anti-dupe: every gem gets a unique id bound to its owner. Copies made with ghost items or
  # client mods share that id and are deleted (a second copy, or a copy on another player while
  # the owner still holds the original). Checked on join/respawn/world change/pickup/inventory
  # close and every check-interval-ticks.
  anti-dupe:
    enabled: true
    check-interval-ticks: 40

  # When a player holding a Tier 2 gem dies, drop a Gem Upgrader at their death spot.
  # The gem itself stays Tier 2 — this mints a new upgrader on every Tier 2 death.
  drop-upgrader-on-tier2-death: false

  # Gems that must NOT appear in the random starter pool for new players.
  # These stay obtainable through their own means (mythics via rituals, etc.)
  # but are kept out of the random roll. Defaults to the same list if omitted.
  exclude-from-random:
    - auratus
    - heretic
    - gold

  # Gems listed here are left in the death drops instead of being kept and handed back on
  # respawn — losing a fight to someone means losing the gem to them. Use the plain gem id,
  # with no tier suffix. Everything not listed stays soulbound.
  # Example: [heretic, auratus, gold]
  droppable-on-death: []

# ==========================================
# WORLDGUARD INTEGRATION
# ==========================================
worldguard:
  # Enable/disable WorldGuard region checks
  enabled: true

  # Mode for region checking:
  # - "blacklist": Disable gems ONLY in listed regions
  # - "whitelist": Disable gems EVERYWHERE except listed regions
  mode: "blacklist"

  # List of region IDs (depends on mode)
  # Blacklist mode: gems disabled in these regions
  # Whitelist mode: gems enabled ONLY in these regions
  regions:
    - "spawn"
    - "safe-zone"

  # Message shown when abilities are blocked
  disabled-message: "&c&lGem abilities are disabled in this region!"

# ==========================================
# SMP START SYSTEM
# ==========================================
smp:
  started: false
  auto-start-threshold: 10

# ==========================================
# FIXED HEARTS
# ==========================================
# When enabled, every player is forced back to exactly 10 hearts (vanilla
# 20.0 max health) when they join, stripping any leftover max-health modifiers.
# Toggle in-game with: /fixedhearts everyone true|false
fixed-hearts:
  enabled: false

  # When true, /fixedhearts only strips BlissGems' OWN max-health modifiers and
  # leaves hearts granted by other plugins (Ranked SMP, lifesteal, etc.) intact.
  # Set false to hard-force exactly 10 hearts, wiping all external max-health.
  respect-external-hearts: true

# ==========================================
# CRAFTING RECIPES
# ==========================================
crafting:
  # Enable/disable custom crafting recipes
  # Based on Bliss SMP Season 3 recipes
  enabled: true

# ==========================================
# COMBAT
# ==========================================
combat:
  # Ender pearl cooldown in seconds
  ender-pearl-cooldown-seconds: 15

  # Gem holders hit harder when the victim's own gem is Broken (energy 0).
  broken-gem-bonus:
    enabled: true
    damage-multiplier: 1.5

# ==========================================
# ABILITY KEYBINDS
# ==========================================
# Which input fires which ability slot, for players who have not rebound anything
# themselves. Players override these for their own account with
#   /bliss ability                      - the controls menu (click an ability to change its key)
#   /bliss ability set <slot> <input>   - rebind one slot (same as /bliss set_ability)
#   /bliss ability set <slot> none      - unbind a slot
#   /bliss ability reset                - back to the defaults below
#
# Inputs: right_click, shift_right_click, left_click, shift_left_click,
#         swap_hand (F), shift_swap_hand
# Slots:  primary, secondary, tertiary, quaternary, and quinary + senary, which only
#         the Gold Gem defines (its harvested soul's 3rd and 4th abilities).
#
# One input per slot and one slot per input. Set a slot to "none" to leave that input
# alone - unbound left-click keeps its vanilla behaviour (mining, attacking).
# Delete this whole section to fall back to the built-in defaults.
ability-bindings:
  # Default controls (players change theirs in /bliss ability):
  #   right click = ability 1, shift + right click = ability 2,
  #   hit / left click = ability 3, shift + hit / left click = ability 4.
  # F (swap offhand) is left alone unless a player binds something to it.
  # Inputs: right_click, shift_right_click, left_click, shift_left_click, swap_hand, shift_swap_hand
  defaults:
    right_click: primary
    shift_right_click: secondary
    left_click: tertiary
    shift_left_click: quaternary
    # The Gold Gem's two extra abilities (quinary, senary) are unbound by default:
    # use /bliss ability quinary|senary, or bind them to F in /bliss ability.

  # Bedrock players get the same four click controls.
  bedrock-defaults:
    right_click: primary
    shift_right_click: secondary
    left_click: tertiary
    shift_left_click: quaternary

# ==========================================
# PASSIVE EFFECTS
# ==========================================
passives:
  # How often to apply passive effects (in ticks, 20 ticks = 1 second)
  update-interval: 20

  # Also grant gem passives when the gem sits anywhere in the hotbar (not just the
  # offhand). Helps Bedrock players who can't easily use the offhand slot.
  apply-in-hotbar: true

  # Extra potion effects applied to the player every passive tick while the
  # gem is held in the offhand (stacks on top of built-in passives).
  # Use Bukkit PotionEffectType names (SPEED, NIGHT_VISION, JUMP_BOOST, etc.).
  # Level is 1-based (level: 1 = "I", level: 2 = "II", ...).
  # Leave a list empty to grant no extra effect for that gem/tier.
  extra-effects:
    astra:
      t1: []
      t2: []
    fire:
      t1: []
      t2: []
    flux:
      t1: []
      t2: []
    life:
      t1: []
      t2: []
    puff:
      t1: []
      t2: []
    speed:
      t1: []
      t2: []
    strength:
      t1: []
      t2: []
    wealth:
      t1: []
      t2: []
  # Tier-specific passive values (tier1 = weaker, tier2 = stronger)
  astra:
    # PHASING: an attack (melee, arrows, explosions, magic) may pass through you. You then blink
    # out for phase-ticks: every hit misses, you turn invisible and your gear vanishes for others.
    phase-cooldown-seconds: 8     # after a phase, no new phase for this long
    phase-hides-gear: true        # hide armour + held items from other players while phased
    # SOUL CAPTURE (sneak + hit/right-click a mob): only mobs worn below this share of their health,
    # and no bigger than the tier's capture-max-health. The gem holds 2 souls.
    capture-health-fraction: 0.5
    # SOUL GUARD: a hit that would leave you at trigger-health (HP) or less burns a captured soul
    # instead - the hit misses, you phase and heal.
    soul-guard:
      enabled: true
      trigger-health: 4.0         # 2 hearts
      cooldown-seconds: 60
    tier1:
      phase-chance: 0.05          # 5% of attacks
      phase-ticks: 15             # 0.75 s intangible
      soul-guard-heal: 4.0        # HP healed when a soul takes the blow
      soul-max-bonus: 4.0         # most bonus max HP Soul Absorption can stack (2 hearts)
      capture-max-health: 30.0    # biggest mob you can bind (zombies, skeletons, spiders...)
    tier2:
      phase-chance: 0.08          # 8% of attacks
      phase-ticks: 20             # 1 s intangible
      soul-guard-heal: 8.0
      soul-max-bonus: 8.0         # 4 hearts
      capture-max-health: 100.0   # up to iron golems and ravagers

  life:
    tier1:
      heal-amount: 0.3  # Hearts healed every 5 seconds
      heal-interval: 100  # Ticks between heals (5 seconds)
      undead-damage-multiplier: 2.0  # 2x damage to undead
      saturation-multiplier: 1.5  # 1.5x saturation gain
      golden-apple-absorption-level: 0  # Absorption I (2 hearts)
    tier2:
      heal-amount: 0.5  # Hearts healed every 5 seconds
      heal-interval: 100  # Ticks between heals (5 seconds)
      undead-damage-multiplier: 3.0  # 3x damage to undead
      saturation-multiplier: 2.0  # 2x saturation gain
      golden-apple-absorption-level: 1  # Absorption II (4 hearts)
    absorption-scan-radius: 5  # Radius scanned for the Life absorption passive
    max-absorption-hearts: 20  # Cap on absorption from the Life passive
    absorption-regen-seconds: 30  # Life absorption shield comes back this long after it breaks

  flux:
    shocking-chance: 0.15  # 15% chance to trigger shocking arrow stun
    charged-creeper-reduction: 1.0  # 1.0 = full immunity, 0.5 = 50% reduction
    tier1:
      shocking-arrow-damage: 2.0  # Electric arrow damage
      flow-state-speed-boost: 0.15  # Additional speed boost in flow state
    tier2:
      shocking-arrow-damage: 3.0  # Electric arrow damage
      flow-state-speed-boost: 0.2  # Additional speed boost in flow state
    max-flow-speed-level: 0  # Highest Speed level Flow State can give (0 = Speed I)

  puff:
    tier1:
      double-jump-enabled: true
      double-jump-velocity: 0.6  # Vertical boost for double jump
      launch-velocity: 3.5  # Upward launch when hitting players
      fall-damage-immunity: true
      sculk-immunity: false  # Tier 1 doesn't have sculk immunity
    tier2:
      double-jump-enabled: true
      double-jump-velocity: 0.8  # Vertical boost for double jump
      launch-velocity: 4.5  # Upward launch when hitting players
      fall-damage-immunity: true
      sculk-immunity: true  # Tier 2 has sculk immunity

  fire:
    tier1:
      auto-smelt: true  # Auto-smelt ores
      fire-resistance: true  # Tier 1 has fire resistance
    tier2:
      auto-smelt: true  # Auto-smelt ores
      fire-resistance: true  # Tier 2 has fire resistance

  speed:
    tier1:
      soul-sand-immunity: true
      speed-level: 0  # Speed I
    tier2:
      soul-sand-immunity: true
      speed-level: 1  # Speed II

  strength:
    tier1:
      strength-level: 0  # Strength I
      bloodthorns-max-bonus-damage: 4.0  # Max bonus damage (2 hearts) at lowest HP
    tier2:
      strength-level: 0  # Strength I (T2's edge is the bigger Bloodthorns + abilities)
      bloodthorns-max-bonus-damage: 6.0  # Max bonus damage (3 hearts) at lowest HP

  wealth:
    tier1:
      luck-level: 0  # Luck I
      villager-discount: 0.10  # 10% discount
      durability-chip-extra-damage: 1  # Extra durability damage per hit per armor piece
      armor-mend-amount: 2  # Durability restored per hit per armor piece
      double-debris: true  # 2x netherite scrap from furnaces
    tier2:
      luck-level: 1  # Luck II
      villager-discount: 0.20  # 20% discount
      durability-chip-extra-damage: 1  # Extra durability damage per hit per armor piece
      armor-mend-amount: 2  # Durability restored per hit per armor piece
      double-debris: true  # 2x netherite scrap from furnaces

  # Unfortunate ability chances (0.0 = never fail, 1.0 = always fail)
  unfortunate:
    attack-fail-chance: 0.25  # 25% chance attacks fail
    block-break-fail-chance: 0.25  # 25% chance block breaking fails
    block-place-fail-chance: 0.25  # 25% chance block placing fails
    eat-fail-chance: 0.25  # 25% chance eating fails
    bow-fail-chance: 0.25  # 25% chance bow shooting fails
    totem-fail-chance: 0.25  # 25% chance totem of undying fails to pop

# ==========================================
# ABILITIES
# ==========================================
abilities:
  # Global ability cooldown (in seconds)
  global-cooldown: 1

  # Specific ability cooldowns (in seconds)
  cooldowns:
    astra-daggers: 75
    astra-projection: 120  # 2 minutes (set when projection ends)
    astra-drift: 60  # Dimensional Drift (set when drift ends)
    astra-void: 120  # 2 minutes - Dimensional Void
    astra-unbounded: 90  # Hit a player with the Astra gem: ride them as a ghost
    fire-fireball: 45
    fire-campfire: 120  # 2 minutes
    fire-crisp: 90  # 1.5 minutes - Evaporate water + scorch terrain
    fire-meteor-shower: 120  # 2 minutes - Rain fire on target area
    flux-ground: 30
    flux-beam: 240  # 4 minutes - Very powerful armor-piercing attack (combined with stun can one-shot)
    flux-conduction: 3  # Copper teleport cooldown
    flux-flashbang: 45  # Flashbang AOE blindness
    flux-kinetic-burst: 30  # Radial knockback
    life-drainer: 60
    life-circle-of-life: 120
    life-vitality-vortex: 45
    life-heart-lock: 75
    puff-dash: 12
    puff-breezy-bash: 45
    puff-group-bash: 60
    puff-launch: 15  # Launch-on-hit passive (Puff gem in main hand)
    speed-blur: 45
    speed-sedative: 60
    speed-storm: 135  # 2.25 minutes (tripled from 45)
    speed-terminal: 60  # Terminal Velocity cooldown
    speed-gale-clouds: 60  # Gale Clouds (Quaternary)
    adrenaline-rush: 180  # T2 only - Speed scales with energy + instant attacks
    strength-nullify: 120
    strength-frailer: 120
    strength-shadow-stalker: 180
    wealth-pockets: 0  # No cooldown for opening
    wealth-item-lock: 90
    wealth-unfortunate: 150
    wealth-rich-rush: 540  # 9 minutes
    wealth-amplification: 300  # 5 minutes
    gold-beam: 10  # Gold Gem Sundering Beam
    puff-updraft: 10  # Puff Updraft
    strength-chad: 10  # Chad Strength

  # Astra Soul Absorption settings (temporary max hearts on kill)
  soul-absorption:
    # Kills fill one shared pool of bonus max HP (capped per tier: passives.astra.tierN.soul-max-bonus).
    # Every kill refreshes the timer; when it runs out the whole bonus fades.
    mob-kill-hearts: 2.0  # HP added on mob kill (2.0 = 1 heart)
    player-kill-hearts: 6.0  # HP added on player kill (6.0 = 3 hearts)
    duration: 60  # Seconds after the last kill before the bonus fades

  # Astra Projection settings (spectator mode scout)
  astra-unbounded:
    range: 12.0  # /bliss unbounded reaches the player you look at (or name) within this many blocks
  astra-projection:
    radius: 128  # Maximum distance from origin in blocks (8 chunks)

  # Astra Spook settings

  # Astra Dimensional Void settings
  astra-void:
    radius: 10.0  # Void suppression radius in blocks

  # Fire Campfire settings
  fire-campfire:
    heal-amount: 0.4  # Health restored per second
    food-amount: 1  # Food level restored per second
    radius: 4.0  # Radius of effect in blocks
    burn-duration: 3  # Seconds enemies burn
    range: 15.0  # How far away you can place the campfire

  # Fire Crisp settings
  fire-crisp:
    radius: 10  # Radius in blocks (sphere) for water evaporation and block scorching

  # Fire Meteor Shower settings
  fire-meteor-shower:
    radius: 8.0  # AoE radius of the meteor shower
    interval-ticks: 10  # Ticks between each meteor (lower = faster rain)
    yield: 2.0  # Explosion yield per meteor (0 = no explosion)
    break-blocks: true  # Whether meteor explosions can break blocks

  # Flux Conduction settings
  flux-conduction:
    range: 10  # Search radius for copper blocks in blocks

  # Flux Flashbang settings
  flux-flashbang:
    radius: 8.0  # AoE radius of the flashbang

  # Flux Kinetic Burst settings
  flux-kinetic-burst:
    radius: 5.0  # AoE radius of the knockback burst
    knockback: 2.0  # Knockback power multiplier

  # Strength Nullify settings
  strength-nullify:
    range: 20  # Raycast range in blocks
    duration: 8  # Seconds Nullify keeps effects stripped

  # Strength Frailer settings
  strength-frailer:
    range: 15  # Raycast range in blocks
    slowness-level: 2  # Slowness amplifier applied to target (1 = I, 2 = II, ...)

  # Strength Shadow Stalker settings
  strength-shadow-stalker:
    duration: 60  # Tracking duration in seconds
    invisibility-max-range: 2500  # Track invisible targets only within this range

  # Strength Chad Strength settings (passive every-4th-hit)
  strength-chad:
    hit-threshold: 4  # Every Nth hit triggers bonus damage
    bonus-damage: 4.0  # Bonus damage in HP (2 hearts)
    duration: 10  # Seconds Chad Strength lasts
    empowered-hits: 4  # Empowered hits per activation

  # Fire Charged Fireball settings
  fire-fireball:
    charge-duration-ticks: 200  # Ticks to reach full charge (20 = 1s; 200 = 10s)
    yield-base: 1.5  # Explosion yield at 0% charge
    yield-per-percent: 0.025  # Yield added per 1% charge (at 100% = yield-base + 100*this)

  # Puff Group Breezy Bash settings
  puff-group-bash:
    radius: 6.0
    knockback: 2.5

  # Life Circle of Life settings
  life-circle:
    radius: 6.0
    max-health-increase: 4.0  # +2 hearts for trusted/self
    max-health-decrease: 4.0  # -2 hearts for untrusted

  # Life Heart Lock settings
  life-heart-lock:
    range: 15

  # Speed Gale Clouds settings (Quaternary)
  gale-clouds:
    clouds: 3  # Throwable clouds granted per activation
    charge-timeout-seconds: 20  # Unthrown clouds expire after this long
    radius: 3.5  # Cloud radius in blocks
    duration-seconds: 5  # How long a landed cloud lingers
    slowness-level: 2  # Slowness II on anyone inside
    slowness-duration-seconds: 4
    wind-charge-cooldown-seconds: 8  # Wind charges locked out for hit players

  # Speed Blur settings
  blur:
    strikes: 5  # Stored lightning strikes granted per activation
    charge-timeout-seconds: 30  # Stored strikes expire after this long
    knockback: 0.4  # Knockback applied per strike (0 = none, 1.5 = old behaviour)

  # Astra Daggers settings
  astra-daggers:
    speed: 1.1  # Flight velocity
    range: 30  # Max travel distance in blocks
    armor-piercing: 0.35  # Percentage of damage that ignores armor (0.0 = 0%, 1.0 = 100% true damage)
    glowing-duration-ticks: 60  # Duration in ticks target glows upon hit (20 ticks = 1 second)
    hover-distance: 1.6  # How far in front of you the daggers hover before being thrown
    hover-timeout-ticks: 600  # Unthrown daggers disappear after this many ticks
    model-data: 12350  # Custom model data of the dagger model
    model-scale: 1.4  # Size of the dagger model
    model-yaw-offset: 180.0  # Rotation fix for the dagger model

  # Speed Storm / Blood Storm settings
  speed-storm:
    radius: 6.0  # Field radius in blocks
    ally-buff-duration: 45  # Duration of Speed and Haste buff to allies
    enemy-slowness-level: 3  # Slowness applied to enemies
    damage: 2.0  # Damage per pulse to enemies caught in the storm

  # Ability damage values
  damage:
    astra-daggers: 5.0  # 2.5 hearts per dagger (5 daggers a volley)
    fire-fireball: 9.0
    flux-beam-base: 10.0  # 2.5x stronger (5 hearts uncharged, up to 15 at 100%)
    flux-beam-max-armor-damage: 250  # 2.5x stronger
    fire-campfire: 2.0  # Damage per second to enemies in range
    fire-meteor-shower: 8.0  # Damage per meteor impact
    life-drainer: 4.0  # Total over 20 seconds
    puff-dash: 4.0
    blur: 2.5  # Damage per lightning strike (5 strikes by default)

    # ==========================================
    # MYTHIC & SPECIAL DAMAGE CONFIGS
    # ==========================================
    # Auratus Chain Strike Damage

    # Blood Saws Damage & Vulnerability

    # Hemorrhage Damage

    # Spore Damage

    # Speed Storm / Blood Storm Damage

  # Ability durations (in seconds)
  durations:
    astra-projection: 10  # Spectator mode scout duration
    astra-drift: 15  # Dimensional Drift invisibility duration
    astra-void: 12  # Dimensional Void suppression duration
    astra-unbounded: 10  # Longest Unbounded ghost-ride (sneak to end early)
    astra-haunt: 15  # How long Unbounded disables the ridden player's gem
    fire-campfire: 15  # How long campfire lasts
    fire-crisp: 15  # How long Crisp water evaporation lasts
    fire-meteor-shower: 8  # Duration of meteor rain
    flux-ground-freeze: 3
    flux-shocking-stun: 1  # Shocking arrow stun duration in seconds
    flux-flashbang: 5  # Flashbang blindness/nausea duration in seconds
    life-drainer: 20
    life-circle: 10
    life-vitality-vortex: 15
    life-heart-lock: 10
    strength-frailer-weakness: 20  # Weakness I duration in seconds
    strength-frailer-wither: 40  # Wither I duration in seconds
    strength-frailer-slowness: 20  # Slowness duration in seconds
    strength-shadow-stalker: 60  # Tracking duration in seconds
    wealth-unfortunate: 40
    wealth-rich-rush: 120
    wealth-amplification: 45
    wealth-item-lock: 10
    terminal-velocity: 10  # Terminal Velocity Speed III + Haste II duration
    speed-storm: 10  # Seconds a Speed Storm lasts
    flux-kinetic-burst: 10  # Kinetic Burst

  # Adrenaline Rush settings
  astra-drift:
    power: 2.8  # Forward launch strength
    lift: 0.35  # Upward launch
    invisibility: 3  # Seconds of invisibility
    fall-immunity: 6  # Seconds of fall damage immunity
  auratus-gemlock:
    range: 20  # Range of the Auratus gem lock
    duration: 10  # Seconds the target's gem stays locked
  flux-charging:
    max-watts: 2000000  # Most watts a Flux gem can store
    charge-per-tick: 0.667  # Beam charge (%) moved from watts per tick while charging
    beam-max-charge: 200.0  # Highest beam charge (%), above 100 is overcharge
  life-drainer:
    steal-hp: 4.0  # HP stolen instantly by Heart Drainer
  puff-dash:
    power: 3.2  # Forward power of the dash
    vertical: 0.18  # Upward push of the dash
  puff-updraft:
    radius: 6.0  # Radius of the updraft
    launch-velocity: 3.2  # How hard the updraft launches
  speed-4th:
    range: 20  # Range of Speed's 4th ability
    # Speed level scales with player energy (0-10)
    # Attack speed is set to instant (no cooldown) for the duration

# ==========================================
# AUTO-ENCHANTING (TIER 2 ONLY)
# ==========================================
auto-enchant:
  enabled: true
  # Let tier 1 gems auto-enchant too, at reduced levels (e.g. Efficiency III instead of V).
  # Set to false to keep auto-enchant a tier 2 perk. Strength always applies its
  # Sharpness at both tiers regardless of this setting.
  tier1-enabled: true
  # Enchantments are applied when holding appropriate tools
  fire:
    flame: true
    fire-aspect: true
  puff:
    power: true
    punch: true
    feather-falling: true
  speed:
    efficiency: true
  strength:
    sharpness: true
  life:
    unbreaking: true
  wealth:
    fortune: true
    looting: true
    mending: true

# ==========================================
# GOLD GEM
# ==========================================
golden-dream:
  # The golden mass tears up terrain around the ritual (a 40-block radius, plus a well under it).
  # false = it still pulls and eats mobs/items, but leaves blocks alone.
  mass-destroys-terrain: true
  # Intruders in the memory hear a whisper (bliss:alternate) near a memory, at most every 20 s.
  memory-proximity-sound: true
  # Where the memory world (goldenworld) comes from when it doesn't exist yet. An existing
  # goldenworld folder is always used as-is, and a map put at /goldendream_import (a world folder
  # next to the server jar) always wins - a singleplayer save's nether/end come along.
  #   generate  - a brand-new world, like the original plugin (default)
  #   copy-main - a copy of the main world
  #   import    - only the /goldendream_import map; without it the fragment ritual won't start
  # To swap the memory for a map later: put it at /goldendream_import, then /goldendream reset confirm.
  memory-world: generate
  # The dream's skies, made without any resource pack so Java and Bedrock players both see them.
  sky:
    # Installs the "bliss_skies" datapack into the main world (needs one restart the first time).
    # It turns the vanilla the_void biome's sky, fog and water gold; the dream pocket uses that biome.
    datapack: true
    pocket-sky-color: "#F2B84B"
    pocket-fog-color: "#FFE3A3"
    pocket-water-color: "#E8B04A"
    pocket-water-fog-color: "#8A5A10"
    # The BlissGems shaderpack (Iris/OptiFine, optional, each player installs it once - /bliss shaders)
    # turns GoldenDome on in the golden dream / ritual and GloomHaze on in the memory world. The
    # plugin signals it through the client's day number; everywhere else the pack shows plain
    # Minecraft. false = never signal (the pack then never changes anything).
    shader-signals: true
    shaderpack-url: "https://github.com/ItzJustNett/blissgems/releases/latest/download/BlissGems-Shaders.zip"
    # Frozen per-player time of day (0-24000). 12600 = golden sunset, 12900 = dusk, 18000 = midnight.
    golden-hour-time: 12600   # near the ritual and the golden mass
    memory-time: 12900        # inside the memory world
    storm-time: 18000         # while the great thunder hangs (with rain)
    # Bedrock players (through Geyser) also get one of the Bedrock client's built-in fogs.
    # Any vanilla Bedrock fog id works; leave empty for none.
    bedrock-fog:
      golden: "minecraft:fog_mesa"
      pocket: "minecraft:fog_mesa"
      memory: "minecraft:fog_basalt_deltas"
      storm: "minecraft:fog_the_end"

gold:
  summon:
    # true = the Gold Gem can only be summoned by the Fragment Core ritual (hold the core,
    # right-click to seal it); crafting it is blocked. false = the recipe below works too.
    ritual-only: true
    # Seven Wire Fragments bound by a Fragment Core craft the Gold Gem. Turn this off if the
    # gem should only ever be handed out by staff (/bliss give <player> gold).
    # The shape and ingredients themselves live in recipes.yml.
    recipe-enabled: true
    # The Gold Gem is a one-time event: once someone crafts it, the recipe never produces
    # another. Set to false to let it be crafted again after it is lost.
    once-per-server: true
  harvest-ceremony:
    # The blow that would kill a gem holder is caught, both players are pinned in place, and
    # the stolen gem rises between them before the kill goes through. Turn this off and the
    # gem is simply taken on death with no animation.
    enabled: true
    # How long the whole thing lasts, in ticks. 80 = 4 seconds.
    duration-ticks: 80
    # How far the gem climbs while it is being torn out.
    rise-height: 3.0
    # Wash both screens in the stolen gem's colour for the duration.
    screen-tint: true
  death:
    # Dying hands every stolen gem back to the player it was taken from.
    return-souls: true
    # ...and leaves the holder's own Gold Gem Broken, so it has to be restored with a
    # Restoration Book before it does anything at all.
    break-gem: true
  armour-trim:
    # Gild the holder's armour while they carry the gem. Armour the player has already
    # trimmed themselves is left alone, and this plugin's gilding is removed again when the
    # gem's power is lost.
    enabled: true
    # Any vanilla trim pattern: FLOW, BOLT, SENTRY, EYE, VEX, WARD, SILENCE, TIDE, SNOUT,
    # RIB, SPIRE, WAYFINDER, SHAPER, RAISER, HOST, DUNE, COAST, WILD.
    pattern: FLOW
  # Gem fragments dropped when a harvested gem is shattered.
  shards-per-harvest: 3
  beam:
    # Ticks the beam winds up for before it fires. The charge is visible and audible,
    # and any damage the caster takes breaks it.
    charge-ticks: 60
    range: 60.0
    # High enough to be devastating (12 hearts), but survivable with turtle master + egap. Lower it if needed.
    damage: 24.0
    cooldown: 300
  damage-boost:
    # Chance for any hit the holder lands to come through amplified.
    chance: 0.15
    multiplier: 1.5

# ==========================================
# UPGRADER SYSTEM
# ==========================================
upgrader:
  # Play effects on upgrade
  play-effects: true
  # Particle effect type
  particle: ENCHANT
  particle-count: 50
  # Sound effect
  sound: ENTITY_PLAYER_LEVELUP
  sound-volume: 1.0
  sound-pitch: 1.5
  charges: 3  # Charges on a Gem Upgrader

# ==========================================
# TRADER SYSTEM
# ==========================================
trader:
  # Cooldown in seconds
  cooldown: 5
  # Play effects on trade
  play-effects: true
  particle: PORTAL
  particle-count: 30
  sound: ENTITY_ENDERMAN_TELEPORT

# ==========================================
# ENERGY BOTTLE
# ==========================================
energy-bottle:
  # Drop chance when Pristine +5 player kills another player
  drop-enabled: true
  # Play effects on absorption
  play-effects: true
  particle: HEART
  particle-count: 20
  sound: ENTITY_EXPERIENCE_ORB_PICKUP

# ==========================================
# PRISMATIC EDGE (legendary sword)
# ==========================================
prismatic-edge:
  beam:
    cooldown-seconds: 120
    range: 24.0  # Beam length in blocks
    damage: 10.0  # 5 hearts per target struck
    hit-radius: 1.6  # How far off the beam line a target is still caught
    freeze-seconds: 3  # Target is frozen in place this long
    regen-seconds: 8  # Regeneration granted to the wielder
    regen-level: 2  # Regeneration II
  combo:
    hits-required: 5  # Consecutive hits before crits kick in
    crit-multiplier: 1.5  # Damage multiplier while in the crit state

# ==========================================
# RESTORATION RITUAL (Restoration Book)
# ==========================================
restoration:
  # Announce the ritual to the whole server
  broadcast: true
  # Storm build-up before the main animation (ticks, 20 = 1 second)
  build-up-ticks: 120
  # Take over the weather for the ritual, restoring it afterwards
  control-weather: true
  # Radius of the closing shockwave that throws witnesses back
  witness-radius: 12.0
  witness-launch-power: 1.4

# ==========================================
# REPAIR KIT / PEDESTAL
# ==========================================
repair-kit:
  # Announce Repair Rituals to the whole server
  broadcast: true
  # Energy restored per second
  energy-per-second: 1
  # Maximum total energy a kit can restore
  max-total-energy: 10
  # Range to heal nearby players (in blocks)
  heal-radius: 10
  # Update interval (in ticks)
  update-interval: 20
  # Prioritize lowest energy players
  prioritize-lowest: true
  # Particle effects
  play-effects: true
  particle: HAPPY_VILLAGER
  particle-count: 5

# ==========================================
# REVIVE BEACON
# ==========================================
revive-beacon:
  # Duration the beacon stays active (in seconds)
  duration: 300  # 5 minutes
  # Range in blocks for revival
  range: 10.0
  # Health restored on revival (as a portion of max health)
  # Use max health value (20.0) for full health
  revive-health: 10.0  # Half health by default
  # Single use (beacon is consumed after first revival)
  single-use: true
  restore-energy: 3  # Energy restored by a Revive Beacon

